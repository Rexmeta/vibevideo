<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeVideo AI</title>
    <script>
      // 1. MUST BE FIRST: Robust process.env shim for browser environment
      window.process = {
        env: {
          NODE_ENV: 'development',
          API_KEY: '' 
        },
        nextTick: (cb) => setTimeout(cb, 0)
      };

      // 2. Error Reporting: If the app fails to load, show the error on screen
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        const root = document.getElementById('root');
        if (root && root.innerHTML === "") {
          root.innerHTML = `
            <div style="padding: 20px; color: #ff4d4d; font-family: sans-serif; background: #fff1f1; border: 2px solid #ffcccc; margin: 20px; border-radius: 12px;">
              <h2 style="margin-top:0">App Launch Failed</h2>
              <p><strong>Error:</strong> ${msg}</p>
              <p style="font-size: 12px; color: #666;">Location: ${url}:${lineNo}</p>
              <button onclick="location.reload()" style="padding: 8px 16px; cursor: pointer; border-radius: 6px; border: 1px solid #ff4d4d; background: white;">Retry Loading</button>
            </div>
          `;
        }
        return false;
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                cyan: '#00C2FF',
                pink: '#FF99E6',
                green: '#4DFF88',
                dark: '#111111',
                light: '#F5F5F7'
              }
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #F5F5F7; margin: 0; }
      #root { min-height: 100vh; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "@google/genai": "https://esm.sh/@google/genai@1.39.0",
    "lucide-react": "https://esm.sh/lucide-react@0.463.0",
    "firebase/app": "https://esm.sh/firebase@11.1.0/app",
    "firebase/auth": "https://esm.sh/firebase@11.1.0/auth",
    "firebase/firestore": "https://esm.sh/firebase@11.1.0/firestore",
    "firebase/storage": "https://esm.sh/firebase@11.1.0/storage",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "firebase/": "https://esm.sh/firebase@^12.9.0/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
